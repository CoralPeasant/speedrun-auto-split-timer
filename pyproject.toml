[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedrun-auto-split-timer"
version = "0.4.2"
description = "Desktop speedrun timer with automatic split detection via screen capture and memory reads."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "speedrun-auto-split-timer maintainers" },
]
keywords = ["speedrun", "timer", "autosplit", "livesplit", "capture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "PySide6>=6.6,<7",
    "dxcam>=0.0.5",
    "numpy>=1.26",
    "pydantic>=2.6,<3",
    "pywin32>=306; sys_platform == 'win32'",
    "watchdog>=4.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "types-pywin32",
]
obs = [
    "obs-websocket-py>=1.0",
]

[project.scripts]
srast = "speedrun_timer.__main__:main"

[project.gui-scripts]
speedrun-auto-split-timer = "speedrun_timer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["speedrun_timer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"